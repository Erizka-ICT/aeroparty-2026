<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AeroParty Admin</title><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">A</span><span>AEROPARTY <b>2026</b> / ADMIN</span></a><button class="ghost-btn" onclick="loadAll()">Refresh</button></header><main class="section-pad"><div class="eyebrow">CONTROL CENTER</div><h1 style="font-family:Cinzel,serif;font-size:42px;margin:0 0 25px">Booking Dashboard</h1><div id="stats" class="class-grid"></div><p class="muted">Periksa bukti, edit data, ekspor rekap, atau hapus pesanan percobaan. Pesanan lunas dilindungi dari penghapusan.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0"><input id="search" placeholder="Cari nama, order, WhatsApp..." oninput="render()" style="padding:10px;min-width:240px"><select id="filter" onchange="render()" style="padding:10px"><option value="">Semua status</option><option>pending</option><option>paid</option><option>rejected</option><option>expired</option><option>cancelled</option></select><a class="primary-btn" href="/api/admin/export.csv">Unduh rekap Excel/CSV</a></div><div style="margin-top:15px;overflow:auto"><table id="table" style="width:100%;border-collapse:collapse;min-width:1100px;font-size:13px"></table></div></main><script>let bookings=[];const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);async function api(u,o){let r=await fetch(u,o);let d=await r.json();if(!r.ok)throw Error(d.error||'Gagal');return d}async function act(id,a){if(!confirm(a==='approve'?'Setujui pembayaran ini?':'Tolak pembayaran dan bebaskan nomor?'))return;try{await api('/api/admin/bookings/'+encodeURIComponent(id)+'/'+a,{method:'POST'});await loadAll()}catch(e){alert(e.message)}}async function edit(id){let b=bookings.find(x=>x.order_id===id);let n=prompt('Nama peserta:',b.full_name);if(n===null)return;let p=prompt('Nomor WhatsApp:',b.phone);if(p===null)return;let e=prompt('Email:',b.email);if(e===null)return;try{await api('/api/admin/bookings/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({fullName:n,phone:p,email:e})});await loadAll();alert('Data peserta diperbarui.')}catch(err){alert(err.message)}}async function del(id){if(!confirm('Hapus pesanan ini? Nomor pending akan dibebaskan. Pesanan lunas tidak dapat dihapus.'))return;try{await api('/api/admin/bookings/'+encodeURIComponent(id),{method:'DELETE'});await loadAll();alert('Pesanan dihapus.')}catch(e){alert(e.message)}}function render(){let q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value;let rows=bookings.filter(x=>(!f||x.status===f)&&[x.order_id,x.full_name,x.phone,x.email].some(v=>String(v||'').toLowerCase().includes(q)));document.querySelector('#table').innerHTML='<tr style="text-align:left;border-bottom:1px solid #304052"><th>Order</th><th>Nama</th><th>Kontak</th><th>Kelas</th><th>Step</th><th>Status</th><th>Bukti</th><th>Aksi</th></tr>'+rows.map(x=>`<tr style="border-bottom:1px solid #172535"><td style="padding:12px">${x.order_id}</td><td>${x.full_name}</td><td>${x.phone}<br>${x.email}</td><td>${x.class_name}</td><td>${x.step_number}</td><td>${x.status}</td><td>${x.has_proof?`<a target="_blank" href="/api/admin/proof/${encodeURIComponent(x.order_id)}">Lihat / unduh</a>`:'Belum ada'}</td><td><button onclick="edit('${x.order_id}')">Edit</button> ${x.status==='pending'?`<button onclick="act('${x.order_id}','approve')">Setujui</button> <button onclick="act('${x.order_id}','reject')">Tolak</button>`:''} <button onclick="del('${x.order_id}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan="8" style="padding:16px">Tidak ada pesanan yang cocok.</td></tr>'}async function loadAll(){try{const [s,b]=await Promise.all([api('/api/admin/stats'),api('/api/admin/bookings')]);bookings=b;document.querySelector('#stats').innerHTML=[['Terverifikasi',s.paid],['Menunggu',s.pending],['Tersedia',s.available],['Pendapatan',money(s.revenue)]].map(x=>`<article class="class-card"><h3 style="font-size:25px">${x[1]}</h3><p>${x[0]}</p></article>`).join('');render()}catch(e){alert(e.message)}}loadAll()</script></body></html>
